<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Mirops CLI impact check</title><desc id="desc">Rendered Kubernetes manifests or Terraform plan JSON are compared against a ClusterMirror report. The CLI reports impact and existing issues, and with enforcement blocks only when the proposed change breaks a dependency or resource use.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="390" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">Check the proposed change against the mirror</text>
<g filter="url(#s)"><rect x="45" y="120" width="225" height="150" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="340" y="120" width="210" height="150" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="625" y="120" width="220" height="150" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="910" y="90" width="150" height="105" rx="18" fill="#fff" stroke="#86efac" stroke-width="2"/><rect x="910" y="220" width="150" height="105" rx="18" fill="#fff" stroke="#fda4af" stroke-width="2"/></g>
<text x="157" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Proposed change</text><text x="157" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Rendered manifests</text><text x="157" y="216" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Terraform plan JSON</text><text x="157" y="245" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">-f / --file</text>
<text x="445" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">ClusterMirror</text><text x="445" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Current relationships</text><text x="445" y="216" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">and resource state</text>
<text x="735" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#047857">Impact evaluation</text><text x="735" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Report risks and blast radius</text><text x="735" y="216" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Check what this change breaks</text><text x="735" y="245" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Does not apply the change</text>
<text x="985" y="127" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">No break</text><text x="985" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Report / pass</text><text x="985" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">with --enforce</text>
<text x="985" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#be123c">Would break</text><text x="985" y="285" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Block with reason</text><text x="985" y="308" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">with --enforce</text>
<path d="M270 195H329" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M550 195H614" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M845 165C875 165 875 142 899 142" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/><path d="M845 225C875 225 875 272 899 272" stroke="#f43f5e" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Existing issues are context; only impact introduced by the proposed change can fail this check.</text></svg>