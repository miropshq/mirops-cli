name: Mirops CLI — CI & Release

# main publishes stable releases (Latest). beta publishes pre-releases — vX.Y.Z-beta.N — to try a
# version in a real pipeline before it reaches main; they never become Latest.
on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─── CI ──────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # ─── semantic-release ────────────────────────────────────────────────────────
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build binaries ───────────────────────────────────────────────────────────
  build:
    name: Build binaries (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=v${{ needs.semantic-release.outputs.new_release_version }}" \
            -o dist/mirops-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirops-${{ matrix.suffix }}
          path: dist/mirops-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 1

  # ─── Attach binaries to the GitHub Release ───────────────────────────────────
  upload:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: [semantic-release, build]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mirops-* > checksums.txt

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-release.outputs.new_release_version }}
          # Keep a beta a pre-release: updating the release must not clear the flag semantic-release set.
          prerelease: ${{ github.ref_name == 'beta' }}
          files: |
            dist/mirops-*
            dist/checksums.txt

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

  # ─── Reset beta to main after a stable release ────────────────────────────────
  # Both hops squash: branch → beta, then beta → main. The release on main is a squash of everything on
  # beta, so beta's own commits are copies main doesn't have — left there, the next beta would count
  # them again (that's how a docs change once cut v0.4.0-beta.1). Right after the release beta and main
  # hold the same code, so beta is reset to main: the next beta counts from vX.Y.Z. Only when the code
  # is identical — if beta took a pull request after the release one, the job fails instead of
  # dropping it, and beta is reset by hand. beta takes changes only through pull requests; this force
  # push gets through as the release bot GitHub App, the ruleset's one bypass. Its push runs this
  # workflow on beta, which finds nothing to release.
  sync-beta:
    name: Reset beta to main
    runs-on: ubuntu-latest
    needs: [semantic-release, upload]
    if: github.ref_name == 'main' && needs.semantic-release.outputs.new_release_published == 'true'
    steps:
      - name: Release bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write # only to push beta

      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - name: Reset beta to main
        run: |
          if ! git diff --quiet origin/main HEAD; then
            echo "::error::beta has changes that aren't on main — reset it by hand:"
            git diff --stat origin/main HEAD
            exit 1
          fi
          git reset --hard origin/main
          git push --force origin beta
