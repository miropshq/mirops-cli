name: Mirops CLI — CI (development)

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  # ─── CI ──────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # ─── Build binaries ───────────────────────────────────────────────────────────
  build:
    name: Build binaries (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=dev-${{ github.sha }}" \
            -o dist/mirops-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirops-${{ matrix.suffix }}
          path: dist/mirops-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 3

  # ─── Rolling pre-release "dev" ────────────────────────────────────────────────
  upload:
    name: Upload to dev pre-release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mirops-* > checksums.txt

      - name: Update rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "dev (latest)"
          prerelease: true
          body: |
            Latest build from `development` branch.
            Commit: ${{ github.sha }}
          files: |
            dist/mirops-*
            dist/checksums.txt
