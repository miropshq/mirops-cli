<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Mirops CLI upgrade decision</title><desc id="desc">The CLI reads an UpgradeAnalysis report. It treats decision.allow as the deterministic enforcement result and displays readiness score as informational. SAFE and WARNING allow by default; CRITICAL blocks when enforcement is enabled.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="380" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">The decision controls the gate; the score adds context</text>
<g filter="url(#s)"><rect x="50" y="125" width="230" height="145" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="365" y="125" width="230" height="145" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="690" y="80" width="340" height="100" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="690" y="220" width="340" height="100" rx="20" fill="#fff" stroke="#fda4af" stroke-width="2"/></g>
<text x="165" y="166" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">UpgradeAnalysis</text><text x="165" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Target version + findings</text><text x="165" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Opt-in CLI check</text>
<text x="480" y="166" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6d28d9">CLI reads decision</text><text x="480" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">decision.allow + blockers</text><text x="480" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Score is informational</text>
<text x="860" y="119" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">SAFE or WARNING</text><text x="860" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Allowed by default</text><text x="860" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">--enforce-level warning can block WARNING</text>
<text x="860" y="260" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#be123c">CRITICAL</text><text x="860" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Blocked with --enforce</text><text x="860" y="309" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Blockers explain what needs attention</text>
<path d="M280 197H354" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M595 175C635 175 644 130 679 130" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/><path d="M595 220C635 220 644 270 679 270" stroke="#f43f5e" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">A low readiness score alone does not create an upgrade blocker.</text></svg>