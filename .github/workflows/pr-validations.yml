name: CI - Feature / PR (validate)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ─── Lint & static checks ─────────────────────────────────────────────────────
  validate:
    name: Format, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-compliant:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Tidy check (go.mod / go.sum)
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  # ─── Preview next release version (dry run — no tag, no release) ────────────────
  # Runs semantic-release in --dry-run: it computes the version that merging this PR
  # would publish and prints it, but does NOT create a tag, release, or bump anything.
  # The result shows in the job summary so you can see the next version before merging.
  preview-version:
    name: Preview release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # semantic-release needs full history + tags
          ref: ${{ github.head_ref }}

      - name: Compute next version (dry run)
        id: sr
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true             # never publishes — analysis only
          branches: ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report next version
        run: |
          if [ "${{ steps.sr.outputs.new_release_published }}" = "true" ]; then
            echo "### 🔖 Merging this PR would publish **v${{ steps.sr.outputs.new_release_version }}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔖 No release — no releasable commits (docs/chore/etc. only)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── Cross-compile all release targets ────────────────────────────────────────
  build-matrix:
    name: Cross-build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: validate
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=pr-${{ github.event.pull_request.number }}" \
            -o dist/mirops-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }
