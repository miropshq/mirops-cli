<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Mirops CLI report flow</title><desc id="desc">The CLI reads a ClusterMirror report from a local or remote source, runs optional impact, namespace, and upgrade checks, then prints table or JSON output and can enforce configured checks in CI.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="410" rx="28" fill="url(#bg)"/><text x="50" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172554">One report, the checks your workflow needs</text>
<g filter="url(#s)"><rect x="45" y="125" width="220" height="160" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="350" y="125" width="230" height="160" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="665" y="95" width="250" height="220" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="1000" y="125" width="155" height="160" rx="20" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
<text x="155" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Report source</text><text x="155" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Local · HTTP(S)</text><text x="155" y="224" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Amazon S3 · Azure Blob</text><text x="155" y="260" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">CLI process credentials</text>
<text x="465" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6d28d9">mirops scan</text><text x="465" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Reads report, not cluster</text><text x="465" y="224" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">No kubeconfig required</text>
<text x="790" y="137" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#047857">Selected checks</text><text x="790" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Impact of a proposed change</text><text x="790" y="214" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Namespace state · informative</text><text x="790" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">UpgradeAnalysis decision</text><text x="790" y="284" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Enforcement is optional</text>
<text x="1077" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">Output</text><text x="1077" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Table or JSON</text><text x="1077" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Exit code for CI</text>
<path d="M265 205H339" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M580 205H654" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M915 205H989" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="50" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">The CLI never applies changes. With enforcement enabled, a blocking result exits with code 1.</text></svg>